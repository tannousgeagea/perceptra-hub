name: Publish Docker image

on:
  workflow_run:
    workflows: ["Auto Tag Version"]
    types:
      - completed
  # Manual run: rebuilds the latest existing tag from main, no new tag.
  workflow_dispatch:

jobs:
  # Every data-API route must authenticate (api/tests/test_route_auth.py).
  # Runs inside the image about to be published; Django start-up needs Redis,
  # not a database.
  route-auth:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build image (not pushed)
      run: docker build -t perceptrahub:ci .

    - name: Route authentication guard
      run: |
        docker run --rm --network host --entrypoint python3 \
          -w /home/appuser/src/perceptra_hub \
          -e REDIS_HOST=localhost -e REDIS_PORT=6379 \
          -e DJANGO_SECRET_KEY=ci-only-not-a-real-secret \
          -e DATABASE_ENGINE=django.db.backends.postgresql -e DATABASE_HOST=localhost \
          perceptrahub:ci -m unittest api.tests.test_route_auth -v

  build:
    needs: route-auth
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Get latest tag
      id: get-latest-tag
      run: |
        RELEASE_TAG=$(git describe --tags `git rev-list --tags --max-count=1` || echo "0.0.0")
        echo "Latest tag: $RELEASE_TAG"
        echo "RELEASE_TAG=$RELEASE_TAG" >> $GITHUB_ENV

    - name: Build and push Docker image
      uses: docker/build-push-action@v3
      with:
        context: .
        push: true
        # The hub hands new agents the agent images with this same tag
        build-args: |
          APP_VERSION=${{ env.RELEASE_TAG }}
        tags: |
          tannousgeagea/perceptrahub:${{ env.RELEASE_TAG }}
          tannousgeagea/perceptrahub:latest

  # The compute agent (perceptra_hub/agent + training/trainers), published with
  # the hub's tag so a hub at vX.Y.Z installs exactly its own agent. The image is
  # ~9 GB, almost all PyTorch/CUDA: layers are cached in Docker Hub, so a release
  # that only changes code rebuilds and pushes a few MB.
  compute-agent:
    needs: route-auth
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # The runner's free disk isn't enough for a full (uncached) CUDA build
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        df -h /

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Get latest tag
      run: |
        RELEASE_TAG=$(git describe --tags `git rev-list --tags --max-count=1` || echo "0.0.0")
        echo "Latest tag: $RELEASE_TAG"
        echo "RELEASE_TAG=$RELEASE_TAG" >> $GITHUB_ENV

    - name: Build and push compute agent image
      uses: docker/build-push-action@v6
      with:
        context: perceptra_hub
        file: perceptra_hub/docker/agent.Dockerfile
        push: true
        build-args: |
          AGENT_VERSION=${{ env.RELEASE_TAG }}
        tags: |
          tannousgeagea/perceptra-agent:${{ env.RELEASE_TAG }}
          tannousgeagea/perceptra-agent:latest
        cache-from: type=registry,ref=tannousgeagea/perceptra-agent:buildcache
        cache-to: type=registry,ref=tannousgeagea/perceptra-agent:buildcache,mode=max

  # The edge agent that Fleet devices run; small (python slim), same tag as the hub.
  edge-agent:
    needs: route-auth
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Get latest tag
      run: |
        RELEASE_TAG=$(git describe --tags `git rev-list --tags --max-count=1` || echo "0.0.0")
        echo "Latest tag: $RELEASE_TAG"
        echo "RELEASE_TAG=$RELEASE_TAG" >> $GITHUB_ENV

    - name: Build and push edge agent image
      uses: docker/build-push-action@v6
      with:
        context: edge-agent
        push: true
        build-args: |
          AGENT_VERSION=${{ env.RELEASE_TAG }}
        tags: |
          tannousgeagea/perceptra-edge-agent:${{ env.RELEASE_TAG }}
          tannousgeagea/perceptra-edge-agent:latest