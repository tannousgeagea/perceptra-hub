name: Publish Docker image

on:
  workflow_run:
    workflows: ["Auto Tag Version"]
    types:
      - completed

jobs:
  # Every data-API route must authenticate (api/tests/test_route_auth.py).
  # Runs inside the image about to be published; Django start-up needs Redis,
  # not a database.
  route-auth:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build image (not pushed)
      run: docker build -t perceptrahub:ci .

    - name: Route authentication guard
      run: |
        docker run --rm --network host --entrypoint python3 \
          -w /home/appuser/src/perceptra_hub \
          -e REDIS_HOST=localhost -e REDIS_PORT=6379 \
          -e DATABASE_ENGINE=django.db.backends.postgresql -e DATABASE_HOST=localhost \
          perceptrahub:ci -m unittest api.tests.test_route_auth -v

  build:
    needs: route-auth
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Get latest tag
      id: get-latest-tag
      run: |
        RELEASE_TAG=$(git describe --tags `git rev-list --tags --max-count=1` || echo "0.0.0")
        echo "Latest tag: $RELEASE_TAG"
        echo "RELEASE_TAG=$RELEASE_TAG" >> $GITHUB_ENV

    - name: Build and push Docker image
      uses: docker/build-push-action@v3
      with:
        context: .
        push: true
        tags: |
          tannousgeagea/perceptrahub:${{ env.RELEASE_TAG }}
          tannousgeagea/perceptrahub:latest